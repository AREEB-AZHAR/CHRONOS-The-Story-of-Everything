<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <!-- Core Singularity & Energy Gradients -->
    <radialGradient id="chronos-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#a7f3d0" />
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#047857" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="chronos-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#020107" stop-opacity="0" />
    </radialGradient>
    <!-- Orbit Rings Linear Gradients -->
    <linearGradient id="ring-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="ring-violet" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Nebula Glow -->
  <circle cx="60" cy="60" r="48" fill="url(#chronos-glow)" />

  <!-- Outer Celestial Chrono Dial (Time Ring) -->
  <circle cx="60" cy="60" r="52" stroke="url(#ring-emerald)" stroke-width="1" stroke-opacity="0.35" stroke-dasharray="3 4" />
  <circle cx="60" cy="60" r="47" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.18" />

  <!-- 12 Cosmic Epoch Tick Marks -->
  <g stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.2" stroke-linecap="round">
    <line x1="60" y1="9" x2="60" y2="13" />
    <line x1="60" y1="107" x2="60" y2="111" />
    <line x1="9" y1="60" x2="13" y2="60" />
    <line x1="107" y1="60" x2="111" y2="60" />
    <line x1="24" y1="24" x2="27" y2="27" stroke-opacity="0.3" />
    <line x1="96" y1="96" x2="93" y2="93" stroke-opacity="0.3" />
    <line x1="24" y1="96" x2="27" y2="93" stroke-opacity="0.3" />
    <line x1="96" y1="24" x2="93" y2="27" stroke-opacity="0.3" />
  </g>

  <!-- Spacetime Infinity / Armillary Orbit 1 (Tilted Forward) -->
  <ellipse cx="60" cy="60" rx="42" ry="18" transform="rotate(-30 60 60)" stroke="url(#ring-emerald)" stroke-width="2.2" stroke-linecap="round" filter="url(#glow)" />
  <ellipse cx="60" cy="60" rx="42" ry="18" transform="rotate(-30 60 60)" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.8" />

  <!-- Spacetime Infinity / Armillary Orbit 2 (Tilted Reverse) -->
  <ellipse cx="60" cy="60" rx="42" ry="18" transform="rotate(30 60 60)" stroke="url(#ring-violet)" stroke-width="1.6" stroke-opacity="0.75" stroke-dasharray="140 10 30 10" />

  <!-- Orbital Nodes (Planetary / Event Stations) -->
  <circle cx="28" cy="42" r="3" fill="#6ee7b7" filter="url(#glow)" />
  <circle cx="28" cy="42" r="1.5" fill="#ffffff" />
  <circle cx="92" cy="78" r="2.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="92" cy="78" r="1.2" fill="#ffffff" />
  <circle cx="78" cy="28" r="2" fill="#c084fc" />

  <!-- Central Event Horizon / Singularity -->
  <circle cx="60" cy="60" r="16" fill="url(#chronos-core)" filter="url(#glow)" />
  <circle cx="60" cy="60" r="5" fill="#ffffff" />

  <!-- Four-Point Cosmic Pulsar Ray -->
  <path d="M60 40 Q60 58 42 60 Q60 62 60 80 Q60 62 78 60 Q60 58 60 40 Z" fill="#ffffff" fill-opacity="0.95" filter="url(#glow)" />
</svg>
